<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2025" viewBox="0 0 1200 2025" role="img" aria-labelledby="title desc">
<title id="title">ProteomIQon — Beginner workflow</title>
<desc id="desc">A workflow from mzML spectra and Chlamydomonas FASTA reference sequences to peptide identification, protein inference and protein-level quantification. Solid arrows represent primary data flow; dashed arrows show secondary input dependencies.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F9FAFE"/><stop offset="100%" stop-color="#F2F6FB"/></linearGradient>
  <linearGradient id="headAccent" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#4779C7"/><stop offset="44%" stop-color="#218F98"/><stop offset="100%" stop-color="#56A579"/></linearGradient>
  <filter id="cardShadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1B3455" flood-opacity="0.075"/></filter>
  <marker id="mainArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7C8CA8"/></marker>
  <marker id="softArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ACB5C8"/></marker>
  <style><![CDATA[
    text{font-family:Inter,'Segoe UI',Arial,sans-serif;}
    .dark{fill:#1C2941} .muted{fill:#66758F}
    .tool-name{fill:#26314A;font-size:23px;font-weight:650;letter-spacing:-.6px}
    .kicker{font-size:12px;font-weight:760;letter-spacing:1.18px}
    .filename{fill:#36435E;font-size:18px;font-weight:625;letter-spacing:-.18px}
    .section{fill:#60708C;font-size:14px;font-weight:770;letter-spacing:1.9px}
    .main-edge{fill:none;stroke:#7C8CA8;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#mainArrow)}
    .soft-edge{fill:none;stroke:#ADB8CA;stroke-width:2.05;stroke-dasharray:6 9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#softArrow);opacity:.80}
    .hint{fill:#74829C;font-size:14px;font-weight:550;letter-spacing:.15px}
    .caption{fill:#65748F;font-size:13px;font-weight:590;letter-spacing:.8px}
  ]]></style>
</defs>
<rect width="1200" height="2025" fill="url(#bg)"/>
<g transform="translate(0,-155)">
<!-- Input track backgrounds -->
<rect x="81" y="238" width="383" height="277" rx="22" fill="#F0F4FC" stroke="#E4EAF5"/>
<rect x="736" y="238" width="383" height="277" rx="22" fill="#EFF8F8" stroke="#E0F0F0"/>

<g><rect x="100" y="191" width="34" height="30" rx="9" fill="#E4EAF4"/>
    <text x="117" y="211.5" text-anchor="middle" font-size="13.5" font-weight="770" fill="#526788">01</text>
    <text class="section" x="148" y="211.5">PREPARE THE INPUTS</text></g>
<g><rect x="100" y="528" width="34" height="30" rx="9" fill="#E4EAF4"/>
    <text x="117" y="548.5" text-anchor="middle" font-size="13.5" font-weight="770" fill="#526788">02</text>
    <text class="section" x="148" y="548.5">PEPTIDE IDENTIFICATION</text></g>
<g><rect x="100" y="981" width="34" height="30" rx="9" fill="#E4EAF4"/>
    <text x="117" y="1001.5" text-anchor="middle" font-size="13.5" font-weight="770" fill="#526788">03</text>
    <text class="section" x="148" y="1001.5">QUANTIFY IONS &amp; INFER PROTEINS</text></g>
<g><rect x="100" y="1273" width="34" height="30" rx="9" fill="#E4EAF4"/>
    <text x="117" y="1293.5" text-anchor="middle" font-size="13.5" font-weight="770" fill="#526788">04</text>
    <text class="section" x="148" y="1293.5">COMBINE THE EVIDENCE</text></g>
<g><rect x="100" y="1519" width="34" height="30" rx="9" fill="#E4EAF4"/>
    <text x="117" y="1539.5" text-anchor="middle" font-size="13.5" font-weight="770" fill="#526788">05</text>
    <text class="section" x="148" y="1539.5">PROTEIN-LEVEL QUANTIFICATION</text></g>
