    <path d="M88 244V42M88 244H794" stroke-width="3"/>
    <path d="M88 244 C132 244 150 241 170 225 C196 204 207 132 231 122 C253 112 261 214 282 231 C306 251 327 240 350 226 C378 210 387 88 416 73 C448 56 463 215 491 232 C517 248 538 242 564 234 C594 224 605 156 632 148 C658 140 666 216 686 230 C713 248 739 242 794 242" stroke="#042c58" stroke-width="5"/>
    <path d="M88 244H794" stroke="#77b6ba" stroke-width="9" opacity=".22"/>
